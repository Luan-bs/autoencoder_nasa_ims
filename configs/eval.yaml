# Evaluation protocol — FIXED for all models and baselines
#
# Changing this file invalidates all comparisons between existing runs.
# DO NOT MODIFY after the first training run.
# Changes require: new section in this file, bump version, and approval.

version: "1.0"
status: "ACTIVE"

# ── Threshold selection ──────────────────────────────────────────────────────
# Threshold is chosen on the VALIDATION set ONLY.
# Never look at the test set when selecting the threshold.
threshold:
  strategy: "percentile"      # options: "percentile" | "recall_target"
  # if strategy = "percentile":
  percentile: 99.0            # use 99th percentile of TRAIN reconstruction error
  # if strategy = "recall_target":
  recall_target: null         # target recall on val set (unused when strategy=percentile)

# ── Metrics (Unsupervised PHM / Run-to-Failure Protocol) ────────────────────
# Supervised static classification metrics (accuracy, balanced_accuracy,
# precision, f1, confusion_matrix, pr_curve) were removed because run-to-failure
# degradation is continuous and test_set contains the degradation trajectory.
metrics:
  primary: "detection_lead_hours"   # RUL at first sustained alarm (along with recall & false_alarm_rate)

  report_all:
    - recall                        # fraction of degradation files (test) flagged above threshold
    - false_alarm_rate              # fraction of healthy validation files falsely flagged
    - first_alarm_idx               # file index of first sustained alarm in degradation zone
    - detection_lead_files          # RUL in files before failure (test_end_idx - first_alarm_idx)
    - detection_lead_hours          # RUL in hours before failure at first sustained alarm
    - separation_ratio              # mean(test_score) / mean(val_score) — threshold-free contrast
    - spearman_monotonicity         # rank correlation of anomaly score vs time during degradation
    - roc_auc                       # Mann-Whitney U separation between healthy (val) and degradation (test)
    - train_score_mean
    - val_score_mean
    - test_score_mean

  # Sustained alarm: N consecutive files above threshold
  sustained_alarm_window_files: 5

  save_per_run:
    - reconstruction_error_timeline   # anomaly score over time with zones, threshold & 1st alarm RUL
    - explainability_fft_rul          # FFT spectrum at 1st alarm (BPFO verification) + RUL + feature attribution
    - score_distribution              # histogram/KDE of healthy (train/val) vs degradation (test) scores

# ── Seeds ────────────────────────────────────────────────────────────────────
seeds:
  list: [42, 123, 456]
  n_seeds: 3                  # report mean ± std across seeds for all metrics

# ── Experiment management ────────────────────────────────────────────────────
experiment:
  require_clean_git: true     # abort if uncommitted changes (unless --allow-dirty is passed)
  output_dir_by_model: true   # organizes runs under experiments/<model>/<run_id>/
  run_id_format: "YYYYMMDD-HHMM_{model}_{test_set}_seed{seed}"

  # experiments/registry.csv — one row per run
  registry_path: "experiments/registry.csv"
  registry_columns:
    - run_id
    - model
    - test_set
    - channel
    - seed
    - window_size_files
    - recall
    - false_alarm_rate
    - first_alarm_idx
    - detection_lead_files
    - detection_lead_hours
    - separation_ratio
    - spearman_monotonicity
    - roc_auc
    - threshold_value
    - threshold_strategy
    - git_commit
    - data_hash
    - lib_versions
    - device                  # cpu | cuda (+ GPU model)
    - training_time_s
    - timestamp

  # Per-run artefacts saved in experiments/<model>/<run_id>/
  run_artefacts:
    - config.yaml             # full snapshot of all configs at run time
    - metrics.json            # all metrics + RUL & BPFO explainability summary
    - reconstruction_error_timeline.png
    - explainability_fft_rul.png
    - score_distribution.png
    - scaler.pkl              # StandardScaler fitted on train only
    - model.pkl               # or model_weights.pt for PyTorch autoencoders

# ── Baselines ────────────────────────────────────────────────────────────────
# Same protocol, same split, same features, same evaluation for all.
# Only architecture differs.
baselines:
  - name: "pca"
    type: "sklearn"
    note: "PCA reconstruction error — n_components from explained variance ≥ 0.95"
  - name: "isolation_forest"
    type: "sklearn"
    note: "IsolationForest with contamination=auto"

# ── Models to compare ────────────────────────────────────────────────────────
models:
  - name: "mlp"
    input: "window_flat"      # features of L files flattened into 1D vector
  - name: "conv1d"
    input: "window_sequence"  # features of L files as (L, n_features) sequence
  - name: "lstm"
    input: "window_sequence"  # same; LSTM operates on time axis between files
                              # sequences never cross timestamp gaps
