[project]
name = "autoencoder-nasa-ims"
version = "0.1.0"
description = "Anomaly detection in bearings using autoencoders – NASA IMS dataset (PHM research)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Data 
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.15.3",           # FFT, signal processing

    # ML 
    "torch>=2.7.1",            # CUDA 12.8 wheel via [tool.uv.sources] below
    "scikit-learn>=1.7.0",     # PCA, IsolationForest, StandardScaler, metrics

    # Config & experiment tracking 
    "pyyaml>=6.0.2",           # configs/*.yaml
    "tqdm>=4.67.1",            # progress bars

    # Visualisation 
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",

    # Notebooks 
    "jupyterlab>=4.6.4",
    "ipywidgets>=8.1.7",

    # Quality & tests 
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
source-dir = "src"

# ── PyTorch: CUDA 12.8 wheel (RTX 3060 12 GB) ───────────────────────────────
# Falls back to CPU automatically via torch.cuda.is_available() in code.
# On the notebook (no GPU) run: uv sync   → installs CPU-capable CUDA wheel
# On the desktop (RTX 3060)  run: uv sync → same wheel, CUDA kicks in
# Wheel size: ~2.5 GB (larger than CPU-only, but works on both environments)
[[tool.uv.index]]
name = "pytorch-cu128"
url  = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
